[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rai-frontend-gates"
version = "0.1.0"
description = "Frontend stack gate wrapper for rai-cli (npm/vitest/eslint/build)"
authors = [{name = "Julio Adrián", email = "jadrian.s@gmail.com"}]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0,<3.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
rai-frontend = "rai_frontend_gates.cli:app"

[project.urls]
Homepage = "https://github.com/aprendomx/rai-frontend-gates"
Repository = "https://github.com/aprendomx/rai-frontend-gates"
Changelog = "https://github.com/aprendomx/rai-frontend-gates/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/rai_frontend_gates"]
